version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-reminder
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=512 --no-deprecation
      - PORT=3000
      - BACKEND_PORT=8080
      - DATABASE_PATH=/app/data/task-reminder.sqlite
      - WHATSAPP_STORE_PATH=/app/data/whatsapp.sqlite
      - APP_TIMEZONE=Asia/Jakarta
      - CORS_ORIGIN=*
      - ADMIN_PHONE=6281234567890
      - ADMIN_PASSWORD=adminpassword123
    volumes:
      - app_data:/app/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  app_data:
